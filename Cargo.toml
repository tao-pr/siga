[package]
name = "siga"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = "2.14.2"
openapiv3 = "2.2.0"
rand = "0.10.3"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
